<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بنك أسئلة العلوم البيئية — الصف الحادي عشر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f8f6;--card:#fff;--ink:#12322e;--mut:#4b6b66;--pri:#0f8b8d;--pri2:#0a6b6d;--grn:#2f8f4e;--ok:#e3f4e8;--okb:#2f8f4e;--no:#fdeceb;--nob:#c0392b;--line:#cfe3de;--soft:#e2f1ee}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1f1d;--card:#15302d;--ink:#e8f5f2;--mut:#9fc3bc;--pri:#3fc1c3;--pri2:#7fdcdd;--grn:#6fcf8c;--ok:#183a26;--okb:#6fcf8c;--no:#3d1f1d;--nob:#ff8a7d;--line:#2b4f4a;--soft:#1c3b37}}
:root[data-theme="dark"]{--bg:#0e1f1d;--card:#15302d;--ink:#e8f5f2;--mut:#9fc3bc;--pri:#3fc1c3;--pri2:#7fdcdd;--grn:#6fcf8c;--ok:#183a26;--okb:#6fcf8c;--no:#3d1f1d;--nob:#ff8a7d;--line:#2b4f4a;--soft:#1c3b37}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.8 Tajawal,Tahoma,Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
header{background:linear-gradient(135deg,var(--pri2),var(--grn));color:#fff;padding:22px 16px 18px;text-align:center}
header h1{margin:0;font-size:clamp(22px,5vw,34px);font-weight:800}
.teacher{display:inline-block;margin-top:8px;background:rgba(255,255,255,.2);padding:2px 16px;border-radius:99px;font-weight:700}
.motto{margin:14px auto 0;max-width:680px;background:#fff;color:#0a5a45;border-radius:14px;padding:10px 14px;font-weight:800;font-size:clamp(17px,3.6vw,22px)}
main{max-width:860px;margin:0 auto;padding:14px 12px 30px}
.unit{font-weight:800;color:var(--pri2);margin:4px 0 8px}
select.unit{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.tab{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700}
.tab[aria-selected=true]{background:var(--pri2);border-color:var(--pri2);color:#fff}
.tab small{display:block;font-weight:500;opacity:.85;font-size:13px;line-height:1.4}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tools input[type=search],.tools select{flex:1 1 180px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
.tools label{display:flex;align-items:center;gap:6px}
.prog{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar{flex:1 1 160px;height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn);width:0}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.qh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.num{font-weight:800;color:var(--pri2)}
.ref{font-size:13px;color:var(--mut)}
.type{font-size:12px;background:var(--soft);border-radius:8px;padding:0 8px;margin-inline-start:6px}
.qt{margin:6px 0;font-weight:700}
.part{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
.opt.ok{background:var(--ok);border-color:var(--okb)}.opt.no{background:var(--no);border-color:var(--nob)}
.opt input{accent-color:var(--pri);width:18px;height:18px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.b{border:0;background:var(--pri2);color:#fff;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:700}
.b.g{background:var(--soft);color:var(--ink)}
.b:focus-visible,.tab:focus-visible,.opt:focus-within{outline:3px solid var(--pri);outline-offset:2px}
.fb{margin-top:8px;border-radius:10px;padding:8px 12px;font-weight:700}
.fb.ok{background:var(--ok);color:var(--okb)}.fb.no{background:var(--no);color:var(--nob)}
.model{background:var(--soft);border-inline-start:5px solid var(--grn);border-radius:10px;padding:8px 12px;margin-top:8px}
.model .l{font-size:13px;color:var(--mut)}
textarea{width:100%;min-height:80px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px}
table{width:100%;border-collapse:collapse}td,th{border:1px solid var(--line);padding:6px 8px;text-align:center}td:first-child{text-align:start}
img.fig{max-width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#fff;display:block;margin:6px auto}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;overflow:auto;padding:10px}.zoom img{max-width:none;width:min(1200px,200vw);background:#fff}
.flag{background:#fff3cd;color:#664d03;border-radius:8px;padding:2px 8px;font-size:13px;margin-top:6px;display:inline-block}
.empty{text-align:center;color:var(--mut);padding:24px}
.star[aria-pressed=true]{background:#f4b400;color:#222}
footer{text-align:center;color:var(--mut);padding:16px;font-size:14px}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style></head><body>
<header><h1>بنك أسئلة العلوم البيئية — الصف الحادي عشر</h1><div class="teacher">إعداد: أ. رتاج الراسبي</div><div class="motto">كل سؤال تحاولين حلّه، خطوة نحو إتقانكِ 🌱</div></header>
<main><select class="unit" id="unit" aria-label="الوحدة"></select><div class="tabs" id="tabs" role="tablist"></div>
<div class="tools"><input type="search" id="s" placeholder="ابحثي داخل الأسئلة…" aria-label="بحث"><select id="f" aria-label="نوع السؤال"><option value="">كل الأنواع</option><option value="m">اختيار من متعدد</option><option value="tf">صواب / خطأ</option><option value="e">مقالي / تفسيري</option><option value="p">متعدد الفروع</option><option value="n">مسألة حسابية</option></select><label><input type="checkbox" id="mk">المحفوظة فقط</label></div>
<div id="out"></div></main>
<footer>إعداد: أ. رتاج الراسبي · يُحفظ تقدمكِ على هذا الجهاز وهذا المتصفح فقط، دون حساب.</footer>
